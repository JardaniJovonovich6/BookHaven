spring:
  application:
    name: BookHaven

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate :
        format_sql : true

server :
  servlet :
    context-path : /api/v1

jwt:
  secretKey : ${JWT_SECRET_KEY}



frontend:
      url : http://localhost:8080


stripe:
  secret.key : ${STRIPE_SECRET_KEY}
  webhook.secret : ${STRIPE_WEBHOOK_SECRET}